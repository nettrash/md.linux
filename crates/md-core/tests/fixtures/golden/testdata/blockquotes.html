<h1 id="blockquotes">Blockquotes</h1>
<blockquote>
<p>A simple quote.</p>
<p>A second paragraph in the same quote.</p>
</blockquote>
<blockquote>
<p>A quote holding other blocks:</p>
<div class="md-list"><div class="md-item" style="padding-left:0.00em"><span class="md-marker">&bull;</span><span>a list item</span></div><div class="md-item" style="padding-left:0.00em"><span class="md-marker">&bull;</span><span>another item</span></div></div>
<pre><code>a code block inside the quote</code></pre>
</blockquote>
<blockquote>
<p>Level one</p>
<blockquote>
<p>Level two</p>
<blockquote>
<p>Level three</p>
</blockquote>
</blockquote>
</blockquote>
